name: Build MagicAnalyzer APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find
        run: |
          ZIP=$(find . -name "*.zip" -type f | head -1)
          if [ -z "$ZIP" ]; then
            echo "❌ No ZIP file found!"
            ls -la
            exit 1
          fi
          echo "Found: $ZIP"
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -q "${{ steps.find.outputs.zip }}" -d project
          echo "=== Extracted ==="
          ls -la project/
          find project -maxdepth 2 -type f | head -30

      - name: Find Android project root
        id: root
        run: |
          ROOT=$(find project -name "settings.gradle.kts" -type f -exec dirname {} \; | head -1)
          if [ -z "$ROOT" ]; then
            echo "❌ settings.gradle.kts not found!"
            find project -type f | head -50
            exit 1
          fi
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          ls -la "$ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle wrapper
        run: |
          cd "${{ steps.root.outputs.root }}"
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Build APK
        run: |
          cd "${{ steps.root.outputs.root }}"
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find "${{ steps.root.outputs.root }}" -name "app-debug.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found!"
            find "${{ steps.root.outputs.root }}" -name "*.apk" || true
            exit 1
          fi
          echo "APK: $APK"
          echo "apk=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicAnalyzer-Debug
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 14
