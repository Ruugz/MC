name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jika project sudah ada di root repo -> pakai langsung.
      # Jika yang ada hanya file .zip di root -> ekstrak otomatis.
      - name: Siapkan project
        id: proj
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            dir="."
          else
            zipfile=$(find . -maxdepth 1 -iname '*.zip' | sort | head -n1)
            if [ -z "$zipfile" ]; then
              echo "::error::Tidak ada settings.gradle(.kts) maupun file .zip di root repo"
              exit 1
            fi
            echo "Mengekstrak: $zipfile"
            rm -rf _project && mkdir _project
            unzip -q "$zipfile" -d _project
            settings=$(find _project \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -n1)
            if [ -z "$settings" ]; then
              echo "::error::settings.gradle(.kts) tidak ditemukan di dalam zip"
              exit 1
            fi
            dir=$(dirname "$settings")
          fi
          echo "Project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicAnalyzer-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload laporan build (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.proj.outputs.dir }}/app/build/reports/
          if-no-files-found: ignore
