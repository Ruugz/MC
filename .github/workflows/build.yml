name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # =========================================================
      # 1. CHECKOUT REPO
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. DETEKSI STRUKTUR PROJECT
      #    - Cek apakah ada ZIP (MagicAnalyzer_GitHub.zip)
      #    - Cek apakah ada folder project langsung
      #    - Cari settings.gradle.kts sebagai root marker
      # =========================================================
      - name: Detect project structure
        id: detect
        shell: bash
        run: |
          set -e
          echo "=== Listing repo root ==="
          ls -la

          PROJECT_ROOT=""

          # Cari ZIP
          ZIP_FILE=$(find . -maxdepth 3 -name "MagicAnalyzer_GitHub.zip" -type f | head -1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "📦 Found ZIP at: $ZIP_FILE"
            echo "📂 Extracting ZIP..."
            rm -rf _extracted
            mkdir -p _extracted
            unzip -q "$ZIP_FILE" -d _extracted
            echo "=== Extracted contents ==="
            ls -la _extracted/
            PROJECT_ROOT=$(find _extracted -name "settings.gradle.kts" -type f -exec dirname {} \; | head -1)
          else
            echo "📁 No ZIP found, looking for project directly..."
            PROJECT_ROOT=$(find . -maxdepth 4 -name "settings.gradle.kts" -type f -exec dirname {} \; | head -1)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::❌ settings.gradle.kts not found! Project structure invalid."
            echo "=== All files in repo ==="
            find . -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "✅ Android project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT

          echo "=== Project root contents ==="
          ls -la "$PROJECT_ROOT"

      # =========================================================
      # 3. SETUP JDK 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # =========================================================
      # 4. SETUP GRADLE
      #    Menggunakan gradle/actions/setup-gradle yang otomatis
      #    menyediakan Gradle binary (tidak perlu wrapper jar)
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # =========================================================
      # 5. GENERATE GRADLE WRAPPER
      #    Karena gradle-wrapper.jar tidak ikut di-zip,
      #    kita generate ulang dengan versi yang sesuai
      # =========================================================
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e
          cd "${{ steps.detect.outputs.project_root }}"
          echo "🔧 Generating gradle wrapper..."
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          echo "=== Wrapper files ==="
          ls -la gradlew
          ls -la gradle/wrapper/ || true
          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties || true

      # =========================================================
      # 6. VALIDASI PROJECT
      # =========================================================
      - name: Validate project (list tasks)
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.project_root }}"
          ./gradlew --no-daemon --stacktrace tasks

      # =========================================================
      # 7. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.project_root }}"
          ./gradlew --no-daemon --stacktrace assembleDebug

      # =========================================================
      # 8. VERIFIKASI APK
      # =========================================================
      - name: Verify APK output
        id: verify
        shell: bash
        run: |
          set -e
          cd "${{ steps.detect.outputs.project_root }}"
          APK_PATH=$(find app/build/outputs -name "app-debug.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::❌ APK not produced!"
            echo "=== Searching all APK files ==="
            find . -name "*.apk" -type f || true
            exit 1
          fi
          echo "✅ APK found at: $APK_PATH"
          ls -lh "$APK_PATH"
          # Simpan path absolut untuk step upload
          ABS_PATH=$(realpath "$APK_PATH")
          echo "apk_path=$ABS_PATH" >> $GITHUB_OUTPUT

      # =========================================================
      # 9. UPLOAD APK SEBAGAI ARTIFACT
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicAnalyzer-Debug-APK
          path: ${{ steps.verify.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error

      # =========================================================
      # 10. RINGKASAN
      # =========================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## 🎯 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Project root**: \`${{ steps.detect.outputs.project_root }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK path**: \`${{ steps.verify.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Build berhasil!** Download APK di tab 'Artifacts'." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build gagal.** Cek log di atas untuk detail error." >> $GITHUB_STEP_SUMMARY
          fi
